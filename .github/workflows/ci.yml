name: CI pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Dispatched by update-data.yml after committing new data.
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Pipeline unit tests
        run: |
          pip install google-genai
          npm run test:pipeline

      - name: Data integrity checks
        run: npm run test:data

      - name: Unit tests
        run: npm run test:unit

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: E2E tests
        run: npx playwright test

  # update-data.yml dispatches this workflow with GITHUB_TOKEN after committing
  # data. GitHub doesn't start workflow_run chains (deploy.yml) from runs
  # created by that token, so the deploy is dispatched explicitly once tests
  # pass. Runs started by a person still deploy through workflow_run.
  deploy:
    needs: test
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.actor == 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main --repo "${{ github.repository }}"
