name: Update Voting Data

on:
  schedule:
    - cron: "0 6 * * 1" # Every Monday at 6am UTC
  workflow_dispatch:
    inputs:
      full_history:
        description: "Si true, fuerza scraping histórico completo (más lento)."
        required: false
        type: boolean
        default: false

concurrency:
  group: update-voting-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    # A lost raw cache makes the national scraper re-download the full history
    # (~4h); keep headroom for that one-off run.
    timeout-minutes: 330
    permissions:
      contents: write
      actions: write
    env:
      FULL_HISTORY: ${{ github.event.inputs.full_history == 'true' && 'true' || 'false' }}
      CYL_AI_PARSE_FALLBACK: ${{ vars.CYL_AI_PARSE_FALLBACK || 'false' }}
      CYL_AI_PARSE_MODEL: ${{ vars.CYL_AI_PARSE_MODEL || 'gemini-2.5-flash' }}
      # Pinned: npx would otherwise fetch whatever is latest on every run.
      WRANGLER: wrangler@4.86.0

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Restore raw data cache
        id: raw-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            data/raw
            data/state/national
            data/andalucia/raw
            data/andalucia/votos_*_raw.json
            data/andalucia/parse_state.json
            data/cyl/raw
            data/cyl/votos_*_raw.json
            data/cyl/parse_state.json
            data/madrid/raw
            data/madrid/votos_*_raw.json
            data/madrid/parse_state.json
          key: parliament-raw-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            parliament-raw-${{ runner.os }}-${{ github.ref_name }}-
            parliament-raw-${{ runner.os }}-
            congress-raw-

      # Always applied on top of the Actions cache (the cache key includes the
      # run id, so it's never an exact hit); R2 holds the latest full snapshot.
      - name: Restore raw snapshot from R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_R2_BUCKET_DATA_SNAPSHOTS: ${{ secrets.CLOUDFLARE_R2_BUCKET_DATA_SNAPSHOTS }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ] || [ -z "${CLOUDFLARE_R2_BUCKET_DATA_SNAPSHOTS:-}" ]; then
            echo "::warning::Cloudflare R2 secrets missing: raw snapshot not restored (the national scraper will re-download what's missing)."
            exit 0
          fi

          KEY="raw-snapshots/${GITHUB_REF_NAME}/latest.tar.gz"
          TMP_FILE="/tmp/loquevotan-raw-latest.tar.gz"
          if npx --yes "${WRANGLER}" r2 object get "${CLOUDFLARE_R2_BUCKET_DATA_SNAPSHOTS}/${KEY}" --file "${TMP_FILE}" --remote; then
            tar -xzf "${TMP_FILE}" -C .
            echo "Restored raw snapshot from R2: ${KEY}"
          else
            echo "::warning::Could not restore ${KEY} from R2; continuing with the Actions cache only."
          fi

      - name: Count restored raw files
        run: echo "RAW_FILES_RESTORED=$(find data/raw -name '*.json' 2>/dev/null | wc -l)" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 pdfplumber google-genai aiohttp aiofiles

      # Always checks every legislature: it's one request each when data/raw is
      # complete, and re-downloads whatever is missing when it isn't. The step
      # timeout (unlike the job one) still lets the cache/R2 steps below save
      # partial progress for the next run.
      - name: Run National scraper
        timeout-minutes: 240
        run: python scripts/scraper.py

      - name: Run National transformer
        run: |
          if [ -z "${GEMINI_API_KEY}" ]; then
            echo "GEMINI_API_KEY not found, running with --skip-ai"
            python scripts/transform.py --skip-ai
          else
            python scripts/transform.py
          fi
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      # Regional updates must not block the national data: failures are
      # reported at the end of the job and their outputs discarded.
      - name: Run Andalusia update
        id: andalucia
        continue-on-error: true
        run: |
          if [ "${FULL_HISTORY}" = "true" ]; then
            python scripts/andalucia/run_update.py
          else
            python scripts/andalucia/run_update.py --active-only
          fi
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Run CyL update
        id: cyl
        continue-on-error: true
        run: |
          # ccyl.es serves its certificate without the GlobalSign intermediate.
          cat "$(python -m certifi)" scripts/certs/*.pem > "${RUNNER_TEMP}/ca-bundle.pem"
          export REQUESTS_CA_BUNDLE="${RUNNER_TEMP}/ca-bundle.pem"
          CYL_EXTRA_ARGS=""
          if [ "${CYL_AI_PARSE_FALLBACK}" = "true" ]; then
            CYL_EXTRA_ARGS="--ai-parse-fallback --ai-parse-model ${CYL_AI_PARSE_MODEL}"
            echo "CyL AI parse fallback enabled with model: ${CYL_AI_PARSE_MODEL}"
          fi
          if [ "${FULL_HISTORY}" = "true" ]; then
            python scripts/cyl/run_update.py ${CYL_EXTRA_ARGS}
          else
            python scripts/cyl/run_update.py --active-only ${CYL_EXTRA_ARGS}
          fi

      - name: Run Madrid update
        id: madrid
        continue-on-error: true
        run: |
          if [ "${FULL_HISTORY}" = "true" ]; then
            python scripts/madrid/run_update.py
          else
            python scripts/madrid/run_update.py --active-only
          fi

      - name: Discard outputs of failed regional updates
        env:
          FAILED_SCOPES: >-
            ${{ steps.andalucia.outcome == 'failure' && 'andalucia' || '' }}
            ${{ steps.cyl.outcome == 'failure' && 'cyl' || '' }}
            ${{ steps.madrid.outcome == 'failure' && 'madrid' || '' }}
        run: |
          for scope in ${FAILED_SCOPES}; do
            echo "::warning title=${scope}::Actualización fallida; se descartan sus cambios en public/data/${scope}"
            git checkout -- "public/data/${scope}" || true
            git clean -fdq -- "public/data/${scope}" || true
          done

      # Regional transforms rebuild from their raw caches too: if one of them
      # would publish fewer votes than HEAD (lost cache, partial download),
      # keep the published data for that scope instead.
      - name: Discard scopes that would lose votes
        id: shrink-guard
        run: node scripts/qa/guard_shrink.mjs

      - name: Generate Madrid QA report
        run: |
          node scripts/qa/report_madrid_quality.mjs \
            --markdown-out artifacts/madrid-quality.md \
            --json-out artifacts/madrid-quality.json

      - name: Generate data quality audit
        run: |
          node scripts/qa/audit_data_quality.mjs \
            --markdown-out artifacts/data-quality.md \
            --json-out artifacts/data-quality.json

      - name: Build public quality status files
        run: |
          node scripts/qa/build_quality_status.mjs \
            --audit artifacts/data-quality.json \
            --out-dir public/data

      - name: Upload Madrid QA artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: madrid-quality-report-${{ github.run_id }}
          path: |
            artifacts/madrid-quality.md
            artifacts/madrid-quality.json
          if-no-files-found: error

      - name: Upload data quality artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: data-quality-report-${{ github.run_id }}
          path: |
            artifacts/data-quality.md
            artifacts/data-quality.json
          if-no-files-found: error

      - name: Build home extras
        run: python scripts/build_home_extras.py

      - name: Build global index
        run: |
          if [ -f scripts/build_global_index.py ]; then
            python scripts/build_global_index.py
          fi

      - name: Generate data diff summary
        run: node scripts/qa/summarize_update_diff.mjs

      - name: Data integrity gate
        run: node scripts/qa/check_data_integrity.mjs

      - name: Save raw data cache
        if: always() && !cancelled()
        uses: actions/cache/save@v6
        with:
          path: |
            data/raw
            data/state/national
            data/andalucia/raw
            data/andalucia/votos_*_raw.json
            data/andalucia/parse_state.json
            data/cyl/raw
            data/cyl/votos_*_raw.json
            data/cyl/parse_state.json
            data/madrid/raw
            data/madrid/votos_*_raw.json
            data/madrid/parse_state.json
          key: ${{ steps.raw-cache.outputs.cache-primary-key || format('parliament-raw-{0}-{1}-{2}', runner.os, github.ref_name, github.run_id) }}

      - name: Upload raw snapshot to R2 (if configured)
        if: always() && !cancelled()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_R2_BUCKET_DATA_SNAPSHOTS: ${{ secrets.CLOUDFLARE_R2_BUCKET_DATA_SNAPSHOTS }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ] || [ -z "${CLOUDFLARE_R2_BUCKET_DATA_SNAPSHOTS:-}" ]; then
            echo "::warning::Cloudflare R2 secrets missing: raw snapshot not uploaded."
            exit 0
          fi

          RAW_FILES_NOW="$(find data/raw -name '*.json' 2>/dev/null | wc -l)"
          if [ "${RAW_FILES_NOW}" -lt "${RAW_FILES_RESTORED:-0}" ]; then
            echo "::warning::data/raw shrank (${RAW_FILES_RESTORED} -> ${RAW_FILES_NOW}); not overwriting the R2 snapshot."
            exit 0
          fi

          shopt -s nullglob
          SNAP_FILE="/tmp/loquevotan-raw-snapshot.tar.gz"
          INCLUDE_PATHS=(
            data/raw
            data/state/national
            data/andalucia/raw
            data/cyl/raw
            data/madrid/raw
            data/andalucia/parse_state.json
            data/cyl/parse_state.json
            data/madrid/parse_state.json
          )
          INCLUDE_PATHS+=(data/andalucia/votos_*_raw.json)
          INCLUDE_PATHS+=(data/cyl/votos_*_raw.json)
          INCLUDE_PATHS+=(data/madrid/votos_*_raw.json)
          EXISTING_PATHS=()
          for p in "${INCLUDE_PATHS[@]}"; do
            if [ -e "${p}" ]; then
              EXISTING_PATHS+=("${p}")
            fi
          done
          if [ "${#EXISTING_PATHS[@]}" -eq 0 ]; then
            echo "No raw files found to snapshot."
            exit 0
          fi

          tar -czf "${SNAP_FILE}" "${EXISTING_PATHS[@]}"
          TS="$(date -u +%Y%m%dT%H%M%SZ)"
          SHA_SHORT="$(echo "${GITHUB_SHA}" | cut -c1-12)"
          PREFIX="raw-snapshots/${GITHUB_REF_NAME}"
          VERSIONED_KEY="${PREFIX}/${TS}-${SHA_SHORT}.tar.gz"
          LATEST_KEY="${PREFIX}/latest.tar.gz"

          npx --yes "${WRANGLER}" r2 object put "${CLOUDFLARE_R2_BUCKET_DATA_SNAPSHOTS}/${VERSIONED_KEY}" --file "${SNAP_FILE}" --remote
          npx --yes "${WRANGLER}" r2 object put "${CLOUDFLARE_R2_BUCKET_DATA_SNAPSHOTS}/${LATEST_KEY}" --file "${SNAP_FILE}" --remote
          echo "Raw snapshot uploaded to R2:"
          echo "- ${VERSIONED_KEY}"
          echo "- ${LATEST_KEY}"

      - name: Commit and push if changed
        id: commit-data
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B main
          git add -A public/data/ public/data/ambitos.json
          [ -f data/cache_categorias.json ] && git add data/cache_categorias.json || true
          [ -f data/andalucia/cache_categorias.json ] && git add data/andalucia/cache_categorias.json || true
          [ -f data/cyl/cache_categorias.json ] && git add data/cyl/cache_categorias.json || true
          [ -f data/madrid/cache_categorias.json ] && git add data/madrid/cache_categorias.json || true
          git add -A data/state/national

          if git diff --staged --quiet; then
            echo "No changes to commit."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "chore: update voting data (National + Andalusia + CyL + Madrid) $(date +%Y-%m-%d)"
          echo "pushed=true" >> "$GITHUB_OUTPUT"
          echo "new_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

          pushed=0
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then
              echo "Push succeeded on attempt ${attempt}."
              pushed=1
              break
            fi
            git rebase --abort || true
            if [ "${attempt}" -lt 3 ]; then
              echo "Push attempt ${attempt} failed, retrying..."
              sleep 5
            fi
          done

          if [ "${pushed}" -ne 1 ]; then
            echo "Failed to push after 3 attempts."
            exit 1
          fi

      # Pushes made with GITHUB_TOKEN don't trigger other workflows, so CI (and
      # the deploy + D1 sync that follow it) has to be dispatched explicitly.
      - name: Trigger CI and deploy
        if: steps.commit-data.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref main

      - name: Fail if a regional update failed or was discarded
        if: always() && (steps.andalucia.outcome == 'failure' || steps.cyl.outcome == 'failure' || steps.madrid.outcome == 'failure' || steps.shrink-guard.outputs.shrunk_scopes != '')
        run: |
          echo "::error::Actualizaciones regionales: andalucia=${{ steps.andalucia.outcome }} cyl=${{ steps.cyl.outcome }} madrid=${{ steps.madrid.outcome }}; descartadas por perder votos: '${{ steps.shrink-guard.outputs.shrunk_scopes }}'"
          exit 1
